name: CI — Student Hub
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Save generated npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Type-check
        run: npm run typecheck
      - name: Security, finance and branding tests
        run: npm test
      - name: Build
        run: npm run build
