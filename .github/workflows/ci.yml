name: CI — Student Hub
on:
  push:
    branches: [main, "feature/**", "ccr-**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Security, finance and branding tests
        run: npm test
      - name: Build
        run: npm run build
  database-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL 16 if missing
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: Database access-rule tests on a throwaway PostgreSQL
        run: bash tests/sql/run_local.sh
